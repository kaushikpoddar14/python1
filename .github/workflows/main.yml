name: build pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install depencencies
        run: |
          python -m pip install -- upgrade pip
          pip install -r requirement.txt

      - name: run test
        run: |
          pytest
        
        
      
