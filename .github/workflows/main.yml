name: build pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: install depencencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run test
        working working-directory: ./app.py
        run: |
          pytest
        
        
      
